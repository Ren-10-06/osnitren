  <!-- Safety-net branding replacement for stale/cached UI bundles. -->

    (() => {
      const replaceLegacyBranding = () => {
        const walker = document.createTreeWalker(document.body || document.documentElement, NodeFilter.SHOW_TEXT);
        const nodes = [];
        while (walker.nextNode()) nodes.push(walker.currentNode);
        for (const node of nodes) {
          if (/CODER\\s+PETRO\\s+OSINT/i.test(node.nodeValue || "")) {
            node.nodeValue = node.nodeValue.replace(/CODER\\s+PETRO\\s+OSINT/gi, "REN OSINT");
          }
        }
        for (const el of document.querySelectorAll("[aria-label],[title],[alt]")) {
          for (const attr of ["aria-label", "title", "alt"]) {
            const value = el.getAttribute(attr);
            if (value && /CODER\\s+PETRO\\s+OSINT/i.test(value)) el.setAttribute(attr, value.replace(/CODER\\s+PETRO\\s+OSINT/gi, "REN OSINT"));
          }
        }
      };
      new MutationObserver(replaceLegacyBranding).observe(document.documentElement, {childList:true, subtree:true, characterData:true});
      document.addEventListener("DOMContentLoaded", replaceLegacyBranding);
      setTimeout(replaceLegacyBranding, 0);
    })();
